[package]
name = "hello"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Protocol 1.1 (keys, menus, status items, commands with arguments) comes with rhun-ext 1.4.0.
rhun-ext = { git = "https://github.com/rhun-editor/extension-protocol", tag = "rust-v1.4.2" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
