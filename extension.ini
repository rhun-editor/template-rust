# The manifest. rhun reads it from ~/.config/rhun/extensions/OWNER/NAME/extension.ini; name and
# owner must equal the repository's (the release workflow and Install from GitHub check it).
# Every key: https://rhun.app/extensions/v1/ section 2.
name = hello
owner = rhun-editor
title = Hello
description = A starting point for your own extension, in Rust: commands that say hello, with a key, a menu item and a status item.
icon = icon.png
color = #d9803f
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/hello-linux-x86_64
run.macos-arm64 = bin/hello-macos-arm64
run.windows-x64 = bin/hello-windows-x64.exe
on = command

[commands]
say = Say Hello
upper = Upper-case the Document | ctrl+alt+shift+h
greet = Greet

# Protocol 1.1 (rhun 0.18): keys with arguments, menu items, status bar items and language keys,
# declared here; greet in src/main.rs reads where each run came from and the arguments it carries.
[keys]
# a chord: ctrl+k, then ctrl+h, while text has the focus; "world" is greet's argument
ctrl+k ctrl+h = greet world when editorFocus

[menu.editor]
# right-click in a .txt or .md file: Greet, with "the editor" as its argument
greet.args = the editor
greet.when = resourceExt in '.txt .md'

[status]
# left in the status bar while the extension is on; a click runs greet with "the status bar"
hello.text = $(play) Hello
hello.tooltip = Greet from the status bar
hello.command = greet
hello.args = the status bar
hello.align = left

[language.Shell]
# Enter on a "# comment" line of a shell script starts the next line with "# "
continue = #

[subscribe]
opened = *

[needs]
documents = write
